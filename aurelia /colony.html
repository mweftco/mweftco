<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONARCH AI COLONY</title>

  <link rel="stylesheet" href="colony.css">
</head>

<body>

  <header class="topbar">
    <div>
      <div class="brand">MONARCH</div>
      <div class="subtitle">AI COLONY</div>
    </div>

    <div class="system-status">
      <span class="status-dot"></span>
      SYSTEM ONLINE
    </div>
  </header>


  <main class="colony">

    <!-- VERA HQ -->

    <section class="hq">

      <div class="hq-title">
        <span>👑</span>
        VERA — CENTRAL COMMAND
      </div>

      <div class="vera-card">

        <div class="vera-core">
          <div class="core-ring">
            V
          </div>
        </div>

        <div class="agent-name">
          VERA
        </div>

        <div class="agent-role">
          HEAD AI • CENTRAL AUTHORITY
        </div>

        <div class="agent-status working">
          ● WORKING
        </div>

        <div class="task">
          Managing the AI Colony
        </div>

      </div>

    </section>


    <!-- AI OFFICE -->

    <section class="office">

      <div class="office-title">
        AI AGENT WORKSPACE
      </div>


      <div class="agents-grid" id="agentsGrid">

        <!-- Agents will load from backend -->

      </div>

    </section>

  </main>


  <footer>
    <span>VERA CENTRAL AUTHORITY</span>
    <span id="connection">Connecting...</span>
  </footer>


  <script src="colony.js"></script>

</body>
  </html>
